<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>learn/programming</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Space+Grotesk:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
  :root {
    --bg: #0a0a0b; --side: #0d0d0f; --surface: #121214; --surface-2: #19191c; --raised: #202024; --well: #070708;
    --line: #26262b; --line-2: #36363d; --hover-line: #4a4a53;
    --text: #f4f4f5; --soft: #d4d4d8; --muted: #a1a1aa; --faint: #6b6b75; --code: #e7e7ea;
    --accent: #ef233c; --accent-hi: #ff4d5e; --accent-deep: #7a0f1d;
    --gold: #f7b538; --gold-hi: #ffd479; --pass: #34d399; --fail: #ff5470; --todo: #f7b538;
    --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
    --display: "Space Grotesk", "Inter", "Segoe UI", sans-serif;
  }
  /* Settings → Background and Accent color */
  :root[data-background="black"] { --bg: #000; --side: #050506; --surface: #0b0b0c; --surface-2: #121214; --raised: #19191b;
    --well: #000; --line: #1e1e22; --line-2: #2c2c31; }
  :root[data-accent="orange"] { --accent: #f97316; --accent-hi: #fb923c; --accent-deep: #7c2d12; }
  :root[data-accent="gold"] { --accent: #eab308; --accent-hi: #facc15; --accent-deep: #713f12; }
  :root[data-accent="green"] { --accent: #22c55e; --accent-hi: #4ade80; --accent-deep: #14532d; }
  :root[data-accent="blue"] { --accent: #3b82f6; --accent-hi: #60a5fa; --accent-deep: #1e3a8a; }
  :root[data-accent="purple"] { --accent: #a855f7; --accent-hi: #c084fc; --accent-deep: #581c87; }
  :root[data-accent="pink"] { --accent: #ec4899; --accent-hi: #f472b6; --accent-deep: #831843; }
  /* Settings → Reduce motion */
  .reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation: none !important; transition: none !important; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 16px/1.65 Inter, "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  button { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  code, pre, kbd { font-family: var(--mono); }
  ::selection { background: var(--accent); color: #fff; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 10px; border: 2px solid var(--bg); }
  ::-webkit-scrollbar-track { background: transparent; }

  .app { display: grid; grid-template-columns: 300px 1fr; height: 100vh; }

  /* ---------- sidebar ---------- */
  .side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  .brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 12px; font-family: var(--display); font-weight: 700; font-size: 17px; }
  .logo { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font: 700 13px var(--mono); background: var(--accent); }
  .brand span { color: var(--accent-hi); }
  .nav { display: flex; flex-direction: column; gap: 2px; padding: 4px 10px 10px; border-bottom: 1px solid var(--line); }
  .nav a { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-radius: 10px; color: var(--muted); font-weight: 500; font-size: 15px; }
  .nav a:hover { background: var(--surface-2); color: var(--text); }
  .nav a.active { background: var(--surface-2); color: var(--text); }
  .nav a.active .ni { color: var(--accent-hi); }
  .nav .ni { width: 20px; text-align: center; font-size: 16px; }

  #course-side { display: flex; flex-direction: column; min-height: 0; flex: 1; }
  #course-side[hidden] { display: none; }
  .course-title { display: flex; align-items: center; gap: 10px; padding: 14px 20px 0; font: 700 15px var(--display); color: var(--soft); }
  .player { margin: 10px 16px 8px; padding: 14px 16px 13px; border-radius: 14px; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 16%, var(--surface)), var(--surface) 70%); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
  .player .label { font-size: 11px; text-transform: uppercase; letter-spacing: 2px; color: var(--accent-hi); font-weight: 600; }
  .player .rank { font-family: var(--display); font-size: 22px; font-weight: 700; margin: 1px 0 8px; }
  .player .xp { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 7px; }
  .player .xp b { color: var(--gold-hi); font: 700 17px var(--display); }
  .bar { height: 7px; border-radius: 6px; background: var(--well); overflow: hidden; }
  .bar > div { height: 100%; width: 0; border-radius: 6px; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width 1s cubic-bezier(.2,.8,.2,1); }
  .player.bump { animation: bump .6s ease; }
  @keyframes bump { 35% { transform: scale(1.03); } }

  .list { overflow-y: auto; padding: 0 10px 24px; flex: 1; }
  .chapter { margin-top: 8px; }
  .ch-head { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px 6px; border: 0; background: none; cursor: pointer; text-align: left; }
  .ch-head .ch-name { font: 600 11.5px var(--display); text-transform: uppercase; letter-spacing: 1.8px; color: var(--soft); flex: 1; }
  .ch-head .ch-count { font-size: 12px; color: var(--faint); font-family: var(--mono); }
  .ch-head .caret { color: var(--faint); font-size: 10px; transition: transform .2s; }
  .chapter.closed .caret { transform: rotate(-90deg); }
  .ch-bar { height: 2px; margin: 0 10px 6px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .ch-bar > div { height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); }
  .chapter.closed .items { display: none; }

  .item { display: flex; align-items: center; gap: 12px; width: 100%; padding: 8px 10px; border: 0; background: none; border-radius: 10px; cursor: pointer; text-align: left; position: relative; }
  .item:hover { background: var(--surface-2); }
  .item.active { background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .item.active::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 3px; border-radius: 3px; background: var(--accent-hi); }
  .dot { width: 28px; height: 28px; flex: none; border-radius: 50%; display: grid; place-items: center; font: 600 12px var(--mono); border: 1.5px solid var(--line-2); color: var(--faint); }
  .item.started .dot { border-color: var(--accent-hi); color: var(--accent-hi); }
  .item.done .dot { background: var(--gold); border-color: var(--gold); color: #2a1a00; font-size: 14px; }
  .item .t { flex: 1; min-width: 0; }
  .item .name { font-size: 14.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.done .name { color: var(--muted); }
  .item .meta { font-size: 11.5px; color: var(--faint); display: flex; gap: 8px; align-items: center; }

  .kind { display: inline-block; font: 700 10.5px var(--mono); letter-spacing: .8px; padding: 1px 7px; border-radius: 5px; line-height: 1.6; }
  .k-LEARN { background: #ff8fab1f; color: #ff9fb6; } .k-FIX { background: #ff8a4c1f; color: #ffa070; }
  .k-FILL { background: #f7b5381f; color: var(--gold); } .k-BUILD { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent-hi); }
  .k-PUZZLE { background: #c084fc22; color: #d3a6ff; } .k-REFACTOR { background: #2dd4bf1f; color: #5eead4; }
  .k-TESTS { background: #a3e6351f; color: #bef264; }
  .k-BOSS { background: linear-gradient(90deg, var(--accent), var(--gold)); color: #140507; }

  /* ---------- main ---------- */
  .main { overflow-y: auto; min-height: 0; position: relative; background: radial-gradient(900px 480px at 85% -10%, color-mix(in srgb, var(--accent) 6%, transparent), transparent 70%), var(--bg); }
  .main::before { content: ""; position: absolute; inset: 0; height: 380px; pointer-events: none;
                  background-image: linear-gradient(#ffffff05 1px, transparent 1px), linear-gradient(90deg, #ffffff05 1px, transparent 1px);
                  background-size: 32px 32px; mask-image: linear-gradient(180deg, #000, transparent); -webkit-mask-image: linear-gradient(180deg, #000, transparent); }
  .wrap { max-width: 900px; margin: 0 auto; padding: 34px 40px 120px; position: relative; }
  .crumbs { font-size: 13.5px; color: var(--faint); margin-bottom: 14px; }
  .crumbs a { color: var(--muted); }
  .crumbs a:hover { color: var(--text); }
  .eyebrow, .head .num { font: 600 12px var(--mono); letter-spacing: 2px; color: var(--accent-hi); text-transform: uppercase; }
  .head .num .done-tag { color: var(--gold); }
  .page-title, .head h1 { margin: 6px 0 10px; font: 700 40px/1.1 var(--display); letter-spacing: -.5px; }
  .lede { color: var(--muted); font-size: 17px; margin: 0 0 26px; max-width: 640px; }
  .head .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 14px; }
  .head .xp-pill { color: var(--gold-hi); font-weight: 600; }
  .head code { background: var(--surface-2); border: 1px solid var(--line); padding: 2px 8px; border-radius: 6px; font-size: 12.5px; color: var(--soft); }
  .section-title { font: 700 13px var(--display); text-transform: uppercase; letter-spacing: 1.8px; color: var(--muted); margin: 34px 0 12px; display: flex; justify-content: space-between; align-items: baseline; }
  .section-title a { font: 500 13px Inter, sans-serif; text-transform: none; letter-spacing: 0; color: var(--accent-hi); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 20px 22px; }
  a.card { display: block; transition: border-color .15s, transform .15s; }
  a.card:hover { border-color: var(--hover-line); transform: translateY(-2px); }

  /* dashboard */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
  .stat .v { font: 700 28px var(--display); line-height: 1.2; }
  .stat .v.gold { color: var(--gold-hi); }
  .stat .l { font-size: 13px; color: var(--muted); }
  .continue { display: grid; grid-template-columns: 1fr auto; gap: 18px 24px; align-items: center; background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 10%, var(--surface)), var(--surface) 60%); }
  .continue .top { display: flex; align-items: center; gap: 14px; }
  .icon-tile { width: 52px; height: 52px; flex: none; border-radius: 14px; display: grid; place-items: center; font-size: 28px; background: var(--raised); border: 1px solid var(--line-2); }
  .continue h3 { margin: 0; font: 700 22px var(--display); }
  .continue .sub { color: var(--muted); font-size: 14px; }
  .next-up { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: var(--well); border: 1px solid var(--line); }
  .next-up .lbl { font: 600 11px var(--mono); letter-spacing: 1.5px; color: var(--faint); text-transform: uppercase; }
  .next-up .tt { font-weight: 600; flex: 1; }
  .chapters-mini { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; }
  .chapters-mini .n { font-size: 13px; color: var(--soft); display: flex; justify-content: space-between; margin-bottom: 5px; }
  .chapters-mini .n span { color: var(--faint); font-family: var(--mono); font-size: 12px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .logo-img { display: block; object-fit: contain; }
  .course-title .logo-img { width: 20px; height: 20px; }
  .crumbs .logo-img { display: inline-block; width: 14px; height: 14px; vertical-align: -2px; }

  /* activity heatmap */
  .hm-top { display: flex; justify-content: space-between; align-items: baseline; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .hm-top .total { font-size: 15px; color: var(--soft); }
  .hm-top .total b { color: var(--text); font: 700 18px var(--display); }
  .hm-top .streak { font-size: 13.5px; color: var(--muted); }
  .hm-top .streak b { color: var(--gold-hi); }
  .hm { max-width: 780px; min-width: 0; }
  .hm-body > *, .hm-grid { min-width: 0; }  /* let the grid shrink in narrow windows instead of spilling out */
  .hm-months, .hm-grid { display: grid; grid-template-columns: repeat(var(--weeks), 1fr); gap: 4px; }
  .hm-months { margin-left: 38px; margin-bottom: 4px; font-size: 11.5px; color: var(--muted); height: 16px; }
  .hm-months span { white-space: nowrap; overflow: visible; }
  .hm-body { display: flex; gap: 8px; }
  .hm-days { width: 30px; display: grid; grid-template-rows: repeat(7, 1fr); gap: 4px; font-size: 11px; color: var(--faint); }
  .hm-days span { display: flex; align-items: center; }
  .hm-grid { flex: 1; grid-template-rows: repeat(7, auto); grid-auto-flow: column; }
  .hm-cell { aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); outline: 1px solid #ffffff06; outline-offset: -1px; }
  .hm-cell.l1 { background: color-mix(in srgb, var(--accent) 28%, var(--surface-2)); } .hm-cell.l2 { background: color-mix(in srgb, var(--accent) 52%, var(--surface-2)); } .hm-cell.l3 { background: color-mix(in srgb, var(--accent) 78%, var(--surface-2)); } .hm-cell.l4 { background: var(--accent-hi); }
  .hm-cell.future { background: transparent; outline: 0; }
  .hm-cell.today { outline: 1.5px solid var(--gold); outline-offset: 0; }
  .hm-foot { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin: 12px 0 0 38px; font-size: 12.5px; color: var(--faint); }
  .legend { display: flex; align-items: center; gap: 4px; }
  .legend .hm-cell { width: 12px; aspect-ratio: 1; }
  .activity { list-style: none; margin: 0; padding: 0; }
  .activity li { display: flex; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid #ffffff08; font-size: 14.5px; }
  .activity li:last-child { border-bottom: 0; }
  .activity .what { flex: 1; min-width: 0; }
  .activity .what div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .activity .when { font-size: 12.5px; color: var(--faint); }
  .activity .plus { color: var(--gold-hi); font: 600 13px var(--mono); }
  .empty { color: var(--faint); font-size: 14.5px; padding: 6px 0; }

  /* courses */
  .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 16px; }
  .course-card { display: flex; flex-direction: column; gap: 14px; }
  .course-card .top { display: flex; gap: 14px; align-items: center; }
  .course-card h3 { margin: 0; font: 700 22px var(--display); }
  .course-card .desc { color: var(--soft); font-size: 15px; margin: 0; }
  .course-card .meta { color: var(--muted); font-size: 13.5px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12.5px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); color: var(--soft); }
  .chip b { color: var(--gold); font-weight: 600; }
  .course-card .foot { display: flex; align-items: center; gap: 14px; margin-top: auto; }
  .course-card .foot .bar { flex: 1; }
  .course-card .pct { font: 600 13px var(--mono); color: var(--muted); }
  .ghost-card { border-style: dashed; background: transparent; display: grid; place-items: center; text-align: center; color: var(--faint); min-height: 220px; }
  .ghost-card .plus { font-size: 30px; }
  .ghost-card code { color: var(--muted); }

  /* achievements */
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .badge { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 6px; }
  .badge .em { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; font-size: 24px; background: #f7b5381a; border: 1px solid #f7b53855; }
  .badge .bt { font-weight: 700; font-size: 15px; }
  .badge .bd { font-size: 13px; color: var(--muted); }
  .badge .bp { display: flex; align-items: center; gap: 8px; font: 12px var(--mono); color: var(--faint); margin-top: auto; padding-top: 6px; }
  .badge .bp .bar { flex: 1; height: 5px; }
  .badge.locked .em { filter: grayscale(1); opacity: .4; background: var(--surface-2); border-color: var(--line); }
  .badge.locked .bt { color: var(--muted); }
  .badge.got { border-color: #f7b53844; }
  .badge.got .bp { color: var(--gold); }
  .mini-badges { display: flex; flex-direction: column; gap: 10px; }
  .mini-badges .badge { flex-direction: row; align-items: center; padding: 10px 12px; gap: 12px; }
  .mini-badges .badge .em { width: 38px; height: 38px; font-size: 20px; flex: none; }

  /* sign-in screen */
  .auth-screen { height: 100vh; overflow-y: auto; display: grid; place-items: center; padding: 30px 16px;
                 background: radial-gradient(800px 500px at 50% -10%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 70%), var(--bg); }
  .auth-box { width: min(420px, 100%); }
  .auth-brand { display: flex; align-items: center; justify-content: center; gap: 12px; font: 700 24px var(--display); margin-bottom: 26px; }
  .auth-brand .logo { width: 40px; height: 40px; font-size: 16px; border-radius: 10px; }
  .auth-brand span { color: var(--accent-hi); }
  .auth-box .form { padding: 28px; }
  .auth-box .form h3 { font-size: 24px; }
  .auth-box .form .sub { margin: -8px 0 4px; }
  .auth-box .form .btn { justify-content: center; padding: 11px; }
  .switch { text-align: center; color: var(--muted); font-size: 14.5px; margin-top: 18px; }
  .switch button { background: none; border: 0; color: var(--accent-hi); font-weight: 600; cursor: pointer; padding: 0 2px; }
  .switch button:hover { text-decoration: underline; }
  .auth-note { text-align: center; color: var(--faint); font-size: 13px; margin-top: 22px; line-height: 1.5; }
  img.avatar { object-fit: cover; padding: 0; }
  .avatar.huge { width: 96px; height: 96px; font-size: 40px; }

  /* icons (Lucide) */
  svg.lucide { width: 1.1em; height: 1.1em; stroke-width: 2; vertical-align: -0.2em; flex: none; }
  .btn svg.lucide { width: 16px; height: 16px; vertical-align: 0; }
  .nav .ni svg { width: 18px; height: 18px; vertical-align: -3px; }
  .flame { color: #ff8a3d; }
  .pass-ic { color: var(--pass); }
  .badge .em svg { width: 22px; height: 22px; }
  .dot svg { width: 14px; height: 14px; stroke-width: 3; vertical-align: 0; }
  .person .place { width: 50px; display: flex; align-items: center; gap: 3px; justify-content: flex-start; }
  .person .place svg { width: 16px; height: 16px; }
  .activity .ck { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; background: #f7b5381c; color: var(--gold); }
  .activity .ck svg { width: 15px; height: 15px; vertical-align: 0; }
  .icon-btn { border: 0; background: none; cursor: pointer; opacity: .65; padding: 4px 8px; color: var(--text); }
  .icon-btn:hover { opacity: 1; }
  .icon-btn svg { width: 20px; height: 20px; }
  .icon-tile svg { width: 26px; height: 26px; color: var(--accent-hi); }
  .update-banner b svg, .brief summary svg { color: var(--gold-hi); }
  .ghost-card .plus svg { width: 30px; height: 30px; }
  .locked-code svg, .lb-tier svg { vertical-align: -2px; }

  /* text in place of icons */
  .logo-text { font: 700 0.9em var(--mono); color: var(--soft); }
  .badge .em { font: 700 13px var(--mono); color: var(--gold-hi); letter-spacing: .5px; }
  .badge.locked .em { color: var(--faint); }
  .person .place.p1 { color: var(--gold-hi); } .person .place.p2 { color: #c9d1db; } .person .place.p3 { color: #e0a36b; }

  /* dashboard greeting (Roblox-style) */
  .hero { display: flex; align-items: center; gap: 22px; padding: 22px 26px; margin-bottom: 22px; background: var(--surface);
          border: 1px solid var(--line); border-radius: 18px; transition: border-color .15s; }
  .hero:hover { border-color: var(--hover-line); }
  .avatar.hero-av { width: 96px; height: 96px; font-size: 42px; }
  .hero-hi { font: 700 34px/1.15 var(--display); letter-spacing: -.4px; margin-bottom: 4px; }
  .hero > div:last-child, .ph-text { flex: 1; min-width: 0; }

  /* player level (from total XP) */
  .level { margin-top: 14px; max-width: 460px; }
  .level .lv-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 7px; font-size: 13px; color: var(--muted); }
  .level .lv-top b { font: 700 17px var(--display); color: var(--text); }
  .level .lv-top .spacer { flex: 1; }
  .level .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .level .bar div { height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--gold), var(--gold-hi)); }
  .lv-chip { font: 700 11.5px var(--mono); color: var(--gold-hi); padding: 2px 7px; border-radius: 6px;
             background: color-mix(in srgb, var(--gold) 14%, transparent); white-space: nowrap; }
  /* games */

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const human = name => name.replace(/^test_/, "").replaceAll("_", " ");
// an icon from the Lucide set (lucide.dev); the watcher at the bottom swaps these placeholders for the real icons
const ic = (name, cls = "") => `<i data-lucide="${name}" class="icon ${cls}"></i>`;
const pct = (a, b) => b ? Math.round(100 * a / b) : 0;
const store = {  // localStorage can be unavailable; the app still works without it
  get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch {} },
};
let S = null, O = null, ME = { signed_in: false }, route = {}, current = 1, lastCheck = null, busy = false;
let soundOn = true;  // from Settings → Effects
let closed = new Set(JSON.parse(store.get("closedChapters", "[]")));

async function api(path, body) {
  const opts = { headers: { "X-Kit": "1" } };  // the local server refuses /api calls without it
  if (body !== undefined) {
    Object.assign(opts, { method: "POST", body: JSON.stringify(body) });
    opts.headers["Content-Type"] = "application/json";
  }
  const res = await fetch(path, opts);
  const data = await res.json();
  if (!res.ok) throw new Error(data.error || res.status);
  return data;
}
const getOverview = () => api("/api/overview");

/* ---------- shared helpers ---------- */
function chapters(missions) {
  const groups = [];
  for (const m of missions) {
    if (!groups.length || groups.at(-1).name !== m.chapter) groups.push({ name: m.chapter, missions: [] });
    groups.at(-1).missions.push(m);
  }
  return groups;
}
const doneCount = ms => ms.filter(m => m.status === "done").length;
const totalXp = ov => ov.courses.reduce((s, c) => s + c.xp + (c.game_xp || 0), 0);  // missions + games

// Levels come from total XP across every course. Each level costs 25 XP more than the last
// (level 2 at 100 XP, level 3 at 225, ...), so finishing Python lands you around level 14.
function levelOf(xp) {
  let level = 1, cost = 100;
  while (xp >= cost) { xp -= cost; level++; cost += 25; }
  return { level, into: xp, need: cost };
}
const lvChip = xp => `<span class="lv-chip" title="${xp} XP">Lv ${levelOf(xp).level}</span>`;
function levelBar(xp) {
  const L = levelOf(xp);
  return `<div class="level"><div class="lv-top"><b>Level ${L.level}</b><span>${xp.toLocaleString()} XP</span><span class="spacer"></span>
    <span>${L.need - L.into} XP to level ${L.level + 1}</span></div>
    <div class="bar"><div style="width:${pct(L.into, L.need)}%"></div></div></div>`;
}
const nextMission = ms => ms.find(m => m.status !== "done");
const isoOf = t => `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`;
const todayIso = () => isoOf(new Date());
// the course's real logo, falling back to its emoji if the image can't load (offline)
const logo = (c, size = 28) => c.logo
  ? `<img class="logo-img" src="${esc(c.logo)}" alt="${esc(c.name)}" width="${size}" height="${size}" onerror="this.replaceWith('${esc(c.name.slice(0, 2))}')">`
  : `<span class="logo-text">${esc(c.name.slice(0, 2))}</span>`;
const dayDiff = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / 864e5);

function streaks(history) {
  const days = [...new Set(history.map(h => h.date))].sort();
  let best = 0, run = 0, prev = null;
  for (const d of days) {
    run = prev && dayDiff(prev, d) === 1 ? run + 1 : 1;
    best = Math.max(best, run);
    prev = d;
  }
  return { current: prev && dayDiff(prev, todayIso()) <= 1 ? run : 0, best };
}

// a day counts toward the streak if you ran a check or finished a mission
const activeDays = ov => ov.history.concat(Object.keys(ov.checks).map(date => ({ date })));

function whenLabel(iso) {
  const d = dayDiff(iso, todayIso());
  if (d === 0) return "today";
  if (d === 1) return "yesterday";
  return new Date(iso + "T12:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
}

function achievements(ov) {
  const done = ov.courses.flatMap(c => c.missions.filter(m => m.status === "done"));
  const { best } = streaks(ov.history);
  const count = (goal, have) => ({ got: have >= goal, have: Math.min(have, goal), goal });
  const list = [
    { icon: ic("footprints"), title: "First Steps", desc: "Complete your first mission", ...count(1, done.length) },
    { icon: ic("flame"), title: "On a Roll", desc: "Complete 5 missions", ...count(5, done.length) },
    { icon: ic("zap"), title: "Unstoppable", desc: "Complete 15 missions", ...count(15, done.length) },
    { icon: ic("swords"), title: "Boss Slayer", desc: "Defeat a boss mission", ...count(1, done.filter(m => m.kind === "BOSS").length) },
    { icon: ic("calendar-check"), title: "Three-Day Streak", desc: "Finish missions 3 days in a row", ...count(3, best) },
    { icon: ic("calendar-days"), title: "Week Warrior", desc: "Finish missions 7 days in a row", ...count(7, best) },
  ];
  for (const c of ov.courses) {
    for (const ch of chapters(c.missions)) {
      list.push({ icon: ic("flag"), title: `${ch.name} Cleared`, desc: `Finish every mission in ${c.name}: ${ch.name}`, ...count(ch.missions.length, doneCount(ch.missions)) });
    }
    list.push({ icon: logo(c, 26), title: `${c.name} Graduate`, desc: `Finish the entire ${c.name} course`, ...count(c.missions.length, doneCount(c.missions)) });
  }
  return list;
}

/* ---------- routing ---------- */
function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
  if (!parts.length || parts[0] === "dashboard") return { page: "dashboard" };
  if (parts[0] === "friends") return { page: "friends", tab: parts[1] || "list" };
  if (parts[0] === "party") return { page: "party", code: parts[1] };
  if (parts[0] === "games") return { page: "games", track: decodeURIComponent(parts[1] || ""), mode: parts[2], hole: parts[3] };
  if (["courses", "achievements", "settings", "profile", "market"].includes(parts[0])) return { page: parts[0] };
  if (parts[0] === "account") return { page: "profile" };  // old links
  if (parts[0] === "u") return { page: "user", name: decodeURIComponent(parts[1] || "") };
  return { page: "course", track: decodeURIComponent(parts[0]), n: +parts[1] || null };
}

// after "Update now", the app restarts itself; reload once the new version answers
async function waitForNewVersion(old) {
  for (let i = 0; i < 90; i++) {
    await new Promise(r => setTimeout(r, 1000));
    try {
      if ((await api("/api/me")).version !== old) return location.reload();
    } catch {}  // the server is restarting
  }
  toast("The update is taking a while. Try closing the app and opening it again.");
}

// tell the app this window is still open (it quits a few minutes after the window closes)
// The answer also says whether the background update check found something, so the banner appears
// soon after launch (the first check finishes a few seconds after the app opens).
async function ping() {
  try {
    const p = await api("/api/ping");
    if (ME.signed_in && p.update && !ME.update?.available) {
      ME = await api("/api/me");
      renderMe();
    }
  } catch {}
}

/* ---------- activity heatmap (GitHub-style, last 6 months) ---------- */
function heatmap(ov, weeks = 26) {
  const finished = {};
  ov.history.forEach(h => finished[h.date] = (finished[h.date] || 0) + 1);
  const today = new Date();
  today.setHours(12, 0, 0, 0);
  const start = new Date(today);
  start.setDate(today.getDate() - today.getDay() - (weeks - 1) * 7);  // a Sunday, like GitHub
  const cells = [], months = Array(weeks).fill("");
  let total = 0, lastMonth = -1;
  for (let w = 0; w < weeks; w++) {
    for (let d = 0; d < 7; d++) {
      const day = new Date(start);
      day.setDate(start.getDate() + w * 7 + d);
      if (d === 0 && day.getMonth() !== lastMonth) {
        months[w] = day.toLocaleDateString(undefined, { month: "short" });
        lastMonth = day.getMonth();
      }
      if (day > today) { cells.push(`<div class="hm-cell future"></div>`); continue; }
      const iso = isoOf(day), checks = ov.checks[iso] || 0, done = finished[iso] || 0;
      const n = Math.max(checks, done);  // a pass is also a check, so don't double count
      total += n;
      const level = n === 0 ? 0 : n <= 2 ? 1 : n <= 5 ? 2 : n <= 9 ? 3 : 4;
      const date = day.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
      const tip = n ? `${checks} check${checks === 1 ? "" : "s"}${done ? `, ${done} mission${done === 1 ? "" : "s"} finished` : ""} on ${date}` : `Nothing on ${date}`;
      cells.push(`<div class="hm-cell l${level} ${iso === todayIso() ? "today" : ""}" title="${tip}"></div>`);
    }
  }
  if (months[1] || months[2]) months[0] = "";  // the first label would collide with the next one
  const { current, best } = streaks(activeDays(ov));
  return `<div class="card">
    <div class="hm-top"><span class="total"><b>${total}</b> contributions in the last 6 months</span>
      <span class="streak">${ic("flame", "flame")} Current streak <b>${current} day${current === 1 ? "" : "s"}</b> · Longest <b>${best} day${best === 1 ? "" : "s"}</b></span></div>
    <div class="hm" style="--weeks:${weeks}">
      <div class="hm-months">${months.map(m => `<span>${m}</span>`).join("")}</div>
      <div class="hm-body">
        <div class="hm-days"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
        <div class="hm-grid">${cells.join("")}</div>
      </div>
      <div class="hm-foot"><span>Every check and every finished mission counts.</span>
        <span class="legend">Less ${[0, 1, 2, 3, 4].map(l => `<span class="hm-cell l${l}"></span>`).join("")} More</span></div>
    </div>
  </div>`;
}

// shrink a chosen image to a 128x128 square so it's small enough to store with your profile
async function pictureFrom(file) {
  const img = await createImageBitmap(file);
  const side = Math.min(img.width, img.height), c = document.createElement("canvas");
  c.width = c.height = 128;
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#1a1316";  // behind transparent PNGs, since JPEG has no transparency
  ctx.fillRect(0, 0, 128, 128);
  ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 128, 128);
  let quality = 0.85, url = c.toDataURL("image/jpeg", quality);
  while (url.length > 60000 && quality > 0.3) url = c.toDataURL("image/jpeg", quality -= 0.15);
  return url;
}

});

/* ----- Robot Maze ----- */
const DIR_DEG = { E: 0, S: 90, W: 180, N: 270 };

// the board's tiles (walls, floor, gems, flag), absolutely positioned; `mini` also draws the robot
function boardHtml(rows, size, mini = false) {
  const cols = Math.max(...rows.map(r => r.length));
  let html = "";
  rows.forEach((row, y) => [...row.padEnd(cols, "#")].forEach((ch, x) => {
    const at = `left:${x * size}px;top:${y * size}px;width:${size}px;height:${size}px`;
    html += `<div class="tile ${ch === "#" ? "wall" : (x + y) % 2 ? "floor alt" : "floor"}" style="${at}">${
      ch === "*" ? `<span class="gem" data-at="${x},${y}">${ic("gem")}</span>`
      : ch === "G" ? `<span class="goal">${ic("flag")}</span>`
      : mini && "><^v".includes(ch) ? `<span class="mini-bot">${ic("bot")}</span>` : ""}</div>`;
  }));
  return `<div class="board${mini ? " mini" : ""}" style="width:${cols * size}px;height:${rows.length * size}px">${html}</div>`;
}

function robotLevels(D) {
  const best = D.stats.best, got = l => best[`robot/${l.id}`] || 0;
  const total = D.robot.reduce((s, l) => s + got(l), 0);
  return `
    <div class="crumbs"><a href="#/games/${D.track}">Games</a> › Robot Maze</div>
    <div class="game-head"><div><div class="eyebrow">${ic("bot")} ${esc(D.name)}</div><h1 class="page-title">Robot Maze</h1></div>
      <div class="g-big"><span>${total}<small> / ${D.robot.length * 3}</small></span><small>stars</small></div></div>
    <p class="lede">Write real code to steer the robot. Each level has three stars:
      ${ic("flag")} reach the flag, ${ic("gem")} grab every gem, and ${ic("code")} use par lines or fewer.</p>
    <div class="lv-grid">${D.robot.map((l, i) => i === 0 || got(D.robot[i - 1])
      ? `<a class="lv-tile ${got(l) ? "done" : ""}" href="#/games/${D.track}/robot/${l.id}">
          <span class="lv-n">${i + 1}</span><span class="lv-t">${esc(l.title)}</span><span class="lv-stars">${starRow(got(l))}</span></a>`
      : `<div class="lv-tile locked"><span class="lv-n">${ic("lock")}</span><span class="lv-t">${esc(l.title)}</span>
          <span class="lv-stars">Beat level ${i} first</span></div>`).join("")}</div>`;
}

function robotLevel(D, id, party = false) {
  const i = D.robot.findIndex(l => l.id === id), L = D.robot[i];
  if (!L || (!party && i > 0 && !D.stats.best[`robot/${D.robot[i - 1].id}`])) return robotLevels(D);
  G = { D, game: "robot", L, i, party, crashes: 0, speed: +store.get("robotSpeed", "1"), angle: 0 };
  const game = G;
  setTimeout(() => G === game && !$("#bot") && drawWorld(0));  // once the page is on screen
  const commands = ["move()", "turn_left()", "turn_right()", "collect()", "front_is_clear()", "on_gem()", "at_goal()"]
    .filter(c => !(L.banned || []).includes(c.slice(0, -2)));
  return `
    ${party ? "" : `<div class="crumbs"><a href="#/games/${D.track}">Games</a> › <a href="#/games/${D.track}/robot">Robot Maze</a> › Level ${i + 1}</div>`}
    <div class="game-head"><div><div class="eyebrow">${ic("bot")} ${party ? "Robot Race" : `Level ${i + 1} of ${D.robot.length}`} · par ${L.par} lines</div>
      <h1 class="page-title">${esc(L.title)}</h1></div>
      <div class="lv-stars big" id="lv-stars">${starRow(D.stats.best[`robot/${L.id}`] || 0)}</div></div>
    <div class="robot-layout">
      <div class="robot-left">
        ${L.maps.length > 1 ? `<div class="seg worlds">${L.maps.map((_, w) =>
          `<button class="${w ? "" : "on"}" data-act="robot-world" data-value="${w}">${ic("globe")} World ${w + 1}</button>`).join("")}</div>` : ""}
        <div class="board-wrap" id="board-wrap"></div>
        <div id="robot-msg"></div>
      </div>
      <div class="robot-right">
        <div class="card g-task">${taskHtml(L.intro)}</div>
        <div class="cmd-chips">${commands.map(c => `<button data-act="robot-insert" data-value="${c}" title="Insert ${c}">${c}</button>`).join("")}</div>
        <textarea id="g-code" class="code-input" spellcheck="false" autocomplete="off" autocapitalize="off">${esc(store.get(`robot:${D.track}:${L.id}`, L.starter))}</textarea>
        <div class="actions">
          <button class="btn check" data-act="robot-run" id="robot-run">${ic("play")} Run <kbd>Ctrl+Enter</kbd></button>
          <button class="btn" data-act="robot-reset">${ic("rotate-ccw")} Start over</button>
          <span class="spacer"></span>
          <div class="seg speed">${[1, 2, 4].map(s => `<button class="${G.speed === s ? "on" : ""}" data-act="robot-speed" data-value="${s}">${s}x</button>`).join("")}</div>
        </div>
      </div>
    </div>`;
}

function drawWorld(w) {
  const rows = G.L.maps[w], wrap = $("#board-wrap");
  const cols = Math.max(...rows.map(r => r.length));
  G.size = Math.max(20, Math.min(56, Math.floor((wrap.clientWidth - 26) / cols)));  // minus the padding
  wrap.innerHTML = boardHtml(rows, G.size);
  $("#board-wrap .board").insertAdjacentHTML("beforeend",
    `<div class="bot" id="bot" style="width:${G.size}px;height:${G.size}px"><div class="bot-dir"></div><div class="bot-body">${ic("bot")}</div></div>`);
  const y = rows.findIndex(r => /[><^v]/.test(r)), x = rows[y].search(/[><^v]/);
  G.angle = DIR_DEG[{ ">": "E", "<": "W", "^": "N", v: "S" }[rows[y][x]]];
  placeBot({ x, y, dir: null }, false);
  document.querySelectorAll(".worlds button").forEach((b, i) => b.classList.toggle("on", i === w));
}

function placeBot(s, animate = true) {
  const bot = $("#bot");
  if (!bot) return;
  if (s.dir) G.angle += ((DIR_DEG[s.dir] - G.angle) % 360 + 540) % 360 - 180;  // turn the short way round
  bot.classList.toggle("instant", !animate);
  bot.style.transform = `translate(${s.x * G.size}px, ${s.y * G.size}px)`;
  bot.querySelector(".bot-dir").style.transform = `rotate(${G.angle}deg)`;
}

// replay the robot's moves; resolves false if you leave the page midway
function playSteps(m) {
  const game = G;
  return new Promise(resolve => {
    let i = 0;
    const step = () => {
      if (G !== game) return resolve(false);
      if (i >= m.steps.length) return resolve(true);
      const s = m.steps[i++], bot = $("#bot");
      placeBot(s);
      if (s.action === "collect") {
        $(`.gem[data-at="${s.x},${s.y}"]`)?.classList.add("got");
        tone(988, 0, 0.12, 0.1); tone(1319, 0.07, 0.15, 0.1);
      } else if (s.action === "bump" || s.action === "grab") {
        bot.classList.add("hurt");
        tone(130, 0, 0.3, 0.2, "square");
      } else {
        tone(s.action === "move" ? 520 : 400, 0, 0.05, 0.03, "sine");
      }
      G.anim = setTimeout(step, 340 / G.speed);
    };
    step();
  });
}

async function robotRun() {
  const btn = $("#robot-run");
  if (!btn || busy) return;
  const game = G, code = $("#g-code").value;
  store.set(`robot:${G.D.track}:${G.L.id}`, code);
  busy = true;
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Running…`;
  $("#robot-msg").innerHTML = "";
  try {
    const r = await api("/api/game/robot", { track: G.D.track, level: G.L.id, code });
    if (G !== game) return;
    if (r.problem) return robotMsg("r-fail", `<b>${ic("triangle-alert")} Your code didn't run</b><pre>${esc(r.problem)}</pre>`);
    for (let w = 0; w < r.maps.length; w++) {
      drawWorld(w);
      await sleep(250);
      if (!await playSteps(r.maps[w])) return;
      if (!r.maps[w].won) return robotFail(r.maps[w], w, r.maps.length);
      if (w < r.maps.length - 1) { robotMsg("r-ok", `${ic("check")} World ${w + 1} done! On to world ${w + 2}…`); await sleep(700 / G.speed); }
    }
    robotWin(r);
  } catch (e) {
    toast(e.message);
  } finally {
    busy = false;
    btn.disabled = false; btn.innerHTML = `${ic("play")} Run <kbd>Ctrl+Enter</kbd>`;
  }
}

function robotMsg(kind, html) {
  $("#robot-msg").innerHTML = `<div class="robot-msg ${kind}">${html}</div>`;
}

function selectLine(n) {
  const box = $("#g-code"), lines = box.value.split("\n");
  const start = lines.slice(0, n - 1).join("\n").length + (n > 1 ? 1 : 0);
  box.focus();
  box.setSelectionRange(start, start + (lines[n - 1] || "").length);
}

function robotFail(m, w, worlds) {
  const where = worlds > 1 ? `World ${w + 1}: ` : "";
  const line = (m.crash || m.error)?.line;
  const at = line ? ` <button class="linkbtn" onclick="selectLine(${line})">line ${line}</button>` : "";
  const why = m.error
    ? `<b>${ic("triangle-alert")} ${where}<span class="etype">${esc(m.error.type)}</span>${at}</b><div class="emsg">${esc(m.error.message)}</div>
       ${G.D.errors[m.error.type] ? `<p class="explain">${esc(G.D.errors[m.error.type])}</p>` : ""}`
    : m.crash?.reason === "wall" ? `<b>${ic("octagon-x")} ${where}Bonk! The robot drove into a wall.${at}</b>`
    : m.crash?.reason === "nothing" ? `<b>${ic("octagon-x")} ${where}There's no gem here, so the robot dropped everything.${at}</b><p class="explain">Check with on_gem() before you collect().</p>`
    : m.crash?.reason === "battery" ? `<b>${ic("battery-warning")} ${where}The robot ran out of battery.${at}</b><p class="explain">Is there a loop that never ends? A while loop needs something inside it that eventually makes it stop.</p>`
    : `<b>${ic("flag-off")} ${where}Your code finished, but the robot isn't on the flag.</b>`;

  if (line) selectLine(line);

}

function invStart(seed = null, limit = 0) {
  if (G?.game !== "invaders" || G.running) return;
  const canvas = $("#inv-canvas"), stage = $("#inv-stage"), dpr = devicePixelRatio || 1;
  const W = stage.clientWidth, H = 540;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.height = H + "px";
  const ctx = canvas.getContext("2d");
  ctx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement), v = n => css.getPropertyValue(n).trim();
  Object.assign(G, {
    ctx, W, H, running: true, score: 0, combo: 1, lives: 3, t: 0, last: performance.now(), spawnIn: 0.4, cool: 0,
    rand: seed ? seededRandom(seed) : Math.random, limit,
    ship: { x: W / 2 }, bullets: [], blocks: [], parts: [], floats: [], missed: [], wrong: [], bag: [],
    stars: Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 10 + Math.random() * 40 })),
    color: { accent: v("--accent"), hi: v("--accent-hi"), gold: v("--gold-hi"), text: v("--text"), muted: v("--muted"), line: v("--line-2") },
  });
  $("#inv-overlay").hidden = true;
  invHud();
  G.frame = requestAnimationFrame(invFrame);
}

function invHud() {
  $("#inv-score").textContent = G.score.toLocaleString();
  $("#inv-combo").innerHTML = G.combo > 1 ? `${ic("flame")} x${G.combo} combo` : "";
  document.querySelectorAll("#inv-lives > *").forEach((h, i) => h.classList.toggle("lost", i >= G.lives));
  if (G.party) partyReport({ score: G.score, lives: G.lives });
}

function invSpawn() {
  if (!G.bag.length) G.bag = shuffle(G.D.invaders, G.rand);
  const line = G.bag.pop();
  G.ctx.font = "600 15px " + getComputedStyle(document.body).getPropertyValue("--mono");
  const w = G.ctx.measureText(line.code).width + 28;
  let x = 10;
  for (let tries = 0; tries < 8; tries++) {  // don't stack on top of a block that's still near the top
    x = 10 + G.rand() * Math.max(1, G.W - w - 20);
    if (!G.blocks.some(b => b.y < 60 && x < b.x + b.w && b.x < x + w)) break;
  }
  G.blocks.push({ line, x, y: -36, w, h: 34, speed: 0.85 + G.rand() * 0.3 });
}

function invFloat(x, y, text, color) { G.floats.push({ x, y, text, color, life: 1.2 }); }
function invBurst(x, y, color, n = 18) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 220;
    G.parts.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.6 + Math.random() * 0.4, color });
  }
}

function invHit(b) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  if (b.line.bug) {
    const pts = 100 * G.combo;
    G.score += pts; G.combo = Math.min(5, G.combo + 1);
    invBurst(cx, cy, G.color.hi, 26); invBurst(cx, cy, G.color.gold, 10);
    invFloat(cx, cy, `+${pts}`, G.color.gold);
    tone(660, 0, 0.08, 0.12, "square"); tone(990, 0.06, 0.12, 0.1, "square");
  } else {
    G.lives--; G.combo = 1; G.wrong.push(b.line); G.flash = 0.35;
    invBurst(cx, cy, G.color.muted, 14);
    invFloat(cx, cy, "That line was fine!", "#ff6b6b");
    tone(150, 0, 0.35, 0.2, "sawtooth");
  }
  invHud();
}

function invLand(b) {
  const cx = b.x + b.w / 2;
  if (b.line.bug) {
    G.lives--; G.combo = 1; G.missed.push(b.line); G.flash = 0.35;
    invFloat(cx, G.H - 90, "A bug got through!", "#ff6b6b");
    tone(110, 0, 0.4, 0.2, "sawtooth");
  } else {
    G.score += 25;
    invFloat(cx, G.H - 90, "+25 safe", "#4ade80");
    tone(740, 0, 0.08, 0.05);
  }
  invHud();
}

function invFrame(now) {
  if (G?.game !== "invaders" || !G.running) return;
  const dt = Math.min(0.05, (now - G.last) / 1000), { W, H } = G;
  G.last = now; G.t += dt;
  const dir = (G.keys.has("arrowright") || G.keys.has("d")) - (G.keys.has("arrowleft") || G.keys.has("a"));
  G.ship.x = Math.max(22, Math.min(W - 22, G.ship.x + dir * 480 * dt));
  G.cool -= dt;
  if ((G.keys.has(" ") || G.mouseDown) && G.cool <= 0) {
    G.bullets.push({ x: G.ship.x, y: H - 52 });
    G.cool = 0.26;
    tone(1200, 0, 0.04, 0.03, "square");
  }
  G.spawnIn -= dt;
  if (G.spawnIn <= 0) { invSpawn(); G.spawnIn = Math.max(0.8, 2.1 - G.t * 0.018); }
  const fall = 42 + G.t * 0.9;  // everything speeds up the longer you survive
  for (const b of G.blocks) b.y += fall * b.speed * dt;
  for (const s of G.bullets) s.y -= 640 * dt;
  for (const s of G.bullets) {
    const b = G.blocks.find(b => s.x >= b.x && s.x <= b.x + b.w && s.y >= b.y && s.y <= b.y + b.h);
    if (b) { s.dead = b.dead = true; invHit(b); }
  }
  for (const b of G.blocks) if (!b.dead && b.y + b.h >= H - 66) { b.dead = true; invLand(b); }
  G.blocks = G.blocks.filter(b => !b.dead);
  G.bullets = G.bullets.filter(s => !s.dead && s.y > -10);
  for (const p of G.parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt; p.life -= dt; }
  G.parts = G.parts.filter(p => p.life > 0);
  for (const f of G.floats) { f.y -= 40 * dt; f.life -= dt; }
  G.floats = G.floats.filter(f => f.life > 0);
  G.flash = Math.max(0, (G.flash || 0) - dt);
  invDraw();
  if (G.limit && $("#inv-time")) $("#inv-time").textContent = Math.max(0, Math.ceil(G.limit - G.t)) + "s";
  if (G.lives <= 0 || (G.limit && G.t >= G.limit)) return invOver();
  G.frame = requestAnimationFrame(invFrame);
}

function invDraw() {
  const { ctx, W, H, color } = G;
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = "#07070a"; ctx.fillRect(0, 0, W, H);
  for (const s of G.stars) {
    s.y = (s.y + s.s * 0.016) % H;
    ctx.fillStyle = `rgba(255,255,255,${s.s / 90})`; ctx.fillRect(s.x, s.y, 1.5, 1.5);
  }
  ctx.strokeStyle = color.line; ctx.setLineDash([6, 8]);
  ctx.beginPath(); ctx.moveTo(0, H - 66); ctx.lineTo(W, H - 66); ctx.stroke(); ctx.setLineDash([]);
  ctx.font = "600 15px " + getComputedStyle(document.body).getPropertyValue("--mono");
  ctx.textBaseline = "middle";
  for (const b of G.blocks) {
    ctx.fillStyle = "#18181d"; ctx.strokeStyle = "#34343c"; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 8); ctx.fill(); ctx.stroke();
    ctx.fillStyle = color.text; ctx.fillText(b.line.code, b.x + 14, b.y + b.h / 2 + 1);
  }
  ctx.fillStyle = color.hi; ctx.shadowColor = color.hi; ctx.shadowBlur = 10;
  for (const s of G.bullets) ctx.fillRect(s.x - 2, s.y - 9, 4, 14);
  const x = G.ship.x, y = H - 40;
  ctx.beginPath(); ctx.moveTo(x, y - 22); ctx.lineTo(x + 20, y + 14); ctx.lineTo(x, y + 6); ctx.lineTo(x - 20, y + 14); ctx.closePath(); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.arc(x, y - 3, 4, 0, Math.PI * 2); ctx.fill();
  for (const p of G.parts) { ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.font = "700 16px " + getComputedStyle(document.body).getPropertyValue("--display");
  ctx.textAlign = "center";
  for (const f of G.floats) { ctx.globalAlpha = Math.min(1, f.life); ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y); }
  ctx.textAlign = "left"; ctx.globalAlpha = 1;
  if (G.flash) { ctx.fillStyle = `rgba(255,40,60,${G.flash * 0.5})`; ctx.fillRect(0, 0, W, H); }
}

async function invOver() {

    ${G.wrong.length ? `<div class="inv-review"><h4>${ic("shield-check")} These lines were fine</h4><ul>${list(G.wrong, false)}</ul></div>` : ""}
    <div class="btns"><button class="btn primary" data-act="game-again">${ic("rotate-ccw")} Play again</button>

async function raceStart() {
  if (G?.game !== "racer" || G.phase !== "ready") return;
  const game = G;
  G.phase = "countdown";
  for (const n of [3, 2, 1]) {
    $("#race-overlay").innerHTML = `<div class="countdown">${n}</div>`;
    tone(440, 0, 0.15, 0.12);
    await sleep(700);
    if (G !== game) return;
  }
  tone(880, 0, 0.3, 0.15);
  $("#race-overlay").hidden = true;
  G.phase = "go";
  G.started = performance.now();
  raceCursor();
  G.tick = setInterval(raceTick, 50);
}

const raceSecs = () => (performance.now() - G.started) / 1000;
function raceTick() {
  const t = raceSecs(), len = G.text.length;
  for (const [id, , wpm] of G.lanes) {
    const p = id === "you" ? G.pos / len : G.party ? (P.progress[id]?.v || 0) : Math.min(1, t * wpm * 5 / 60 / len);
    $(`#car-${id}`).style.left = `calc(${p} * (100% - 64px))`;
  }
  $("#race-time").textContent = t.toFixed(1);
  $("#race-wpm").textContent = Math.round(G.pos / 5 / (t / 60)) || 0;
  $("#race-acc").textContent = G.typed ? Math.round(100 * (G.typed - G.errors) / G.typed) : 100;
  if (G.party) partyReport({ v: G.pos / len });
}

function raceCursor(wrong = false) {
  document.querySelectorAll("#race-text span").forEach(s => {
    const i = +s.dataset.i;
    s.className = i < G.pos ? "done" : i === G.pos ? (wrong ? "cur wrong" : "cur") : "";
  });
}

function raceKey(e) {
  if (G.phase === "ready" && e.key === "Enter" && !G.party) { e.preventDefault(); raceStart(); return true; }
  if (G.phase !== "go" || e.ctrlKey || e.metaKey || e.altKey) return false;
  const key = e.key === "Enter" ? "\n" : e.key;
  if (key.length !== 1) return false;
  e.preventDefault();
  G.typed++;
  if (key !== G.text[G.pos]) {
    G.errors++;
    tone(160, 0, 0.08, 0.06, "square");
    raceCursor(true);
    return true;
  }
  G.pos++;
  if (key === "\n") while (G.text[G.pos] === " ") G.pos++;  // the indent types itself
  raceCursor();
  if (G.pos >= G.text.length) raceFinish();
  return true;
}

async function raceFinish() {
  G.phase = "done";
  clearInterval(G.tick);
  raceTick();
  const t = raceSecs(), wpm = Math.round(G.text.length / 5 / (t / 60)), acc = Math.round(100 * (G.typed - G.errors) / G.typed);
  if (G.party) {
    chime();
    $("#race-result").innerHTML = `<div class="race-done"><div class="race-nums"><div><b>${wpm}</b><small>WPM</small></div><div><b>${acc}%</b><small>accuracy</small></div><div><b>${t.toFixed(1)}s</b><small>time</small></div></div><div class="sub">Finished! Waiting for the others…</div></div>`;
    return partyDone({ finished: true, time: t, wpm });
  }
  const place = 1 + G.lanes.filter(([id, , w]) => id !== "you" && G.text.length / (w * 5 / 60) < t).length;
  const game = G;
  let r = { xp: 0, stats: { best: {} } };
  try { r = await api("/api/game/score", { track: G.D.track, game: "racer", score: wpm }); } catch (e) { toast(e.message); }
  if (G !== game) return;
  place === 1 ? (chime(), confetti()) : chime(true);
  $("#race-result").innerHTML = `<div class="race-done">
    <div class="place p${place}">${ic(place === 1 ? "trophy" : "medal")} ${["1st", "2nd", "3rd"][place - 1]} place</div>
    <div class="race-nums"><div><b>${wpm}</b><small>WPM</small></div><div><b>${acc}%</b><small>accuracy</small></div><div><b>${t.toFixed(1)}s</b><small>time</small></div></div>
    ${r.stats.new_best ? `<div class="levelup">${ic("trophy")} New best speed!</div>` : ""}
    <div class="gain">+${r.xp} XP</div>
    <div class="btns"><button class="btn primary" data-act="game-again">${ic("rotate-ccw")} Race again</button>
      <a class="btn" href="#/games/${G.D.track}">Back to games</a></div></div>`;
}

/* ----- party games: play with friends, joined by a game code ----- */
// Everyone in a party joins the Supabase Realtime room "game:<CODE>". The first player in the room is the host:
// they pick the game and start it. Each player runs the game on their own screen and broadcasts their progress,
// so everyone sees the same live scoreboard. Blitz uses a shared random seed, so everyone gets the same bugs.
const PARTY_GAMES = {
  race: { name: "Code Race", icon: "gauge", blurb: "Everyone types the same code. First to the finish line wins.", limit: 180 },
  blitz: { name: "Bug Blitz", icon: "crosshair", blurb: "Same bugs at the same time for 90 seconds. Highest score wins.", limit: 90 },
  robot: { name: "Robot Race", icon: "bot", blurb: "Same Robot Maze level for everyone. First robot to the flag wins.", limit: 300 },
};
const CODE_CHARS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";  // no 0/O or 1/I to mix up
const newPartyCode = () => Array.from({ length: 6 }, () => CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]).join("");
let P = null, supa = null;  // the party you're in, and the Realtime connection

function seededRandom(seed) {  // mulberry32: the same seed gives the same numbers on every computer
  return () => {
    seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

async function realtimeAuth() {
  const r = await api("/api/realtime");
  if (!supa) {
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm");
    supa = createClient(r.url, r.key, { auth: { persistSession: false, autoRefreshToken: false } });
  }
  supa.realtime.setAuth(r.token);
  return r;
}

async function partyJoin(code) {
  partyLeave();
  const r = await realtimeAuth();
  const me = `${r.username}-${Math.random().toString(16).slice(2, 6)}`;  // unique per window
  const chan = supa.channel(`game:${code}`, { config: { private: true, broadcast: { self: true }, presence: { key: me } } });
  P = { code, me, name: r.username, chan, members: {}, phase: "lobby", pick: null, progress: {}, done: {}, round: 0 };
  chan.on("presence", { event: "sync" }, () => {
    if (P?.chan !== chan) return;
    P.members = Object.fromEntries(Object.entries(chan.presenceState()).map(([k, v]) => [k, v[0]]));
    if (isHost() && P.phase === "lobby") partySend("pick", partyPick());  // so people who just joined see the pick
    partyDraw();
    partyCheckEnd();
  });
  chan.on("broadcast", { event: "msg" }, ({ payload }) => P?.chan === chan && partyMessage(payload));
  await new Promise((resolve, reject) => chan.subscribe((status, err) => {
    if (status === "SUBSCRIBED") resolve();
    else if (status === "CHANNEL_ERROR" || status === "TIMED_OUT") reject(new Error("Couldn't connect to the game room. " + (err?.message || "")));
  }));
  await chan.track({ name: r.username, joined: Date.now() });
  P.refresh = setInterval(realtimeAuth, 15 * 60 * 1000);  // logins expire after an hour
}

function partyLeave() {
  if (!P) return;
  clearInterval(P.refresh); clearInterval(P.clock);
  supa?.removeChannel(P.chan);
  P = null;
}

const hostKey = () => Object.entries(P.members).sort((a, b) => a[1].joined - b[1].joined)[0]?.[0];
const isHost = () => hostKey() === P.me;
const partySend = (type, data = {}) => P.chan.send({ type: "broadcast", event: "msg", payload: { type, from: P.me, ...data } });
const partyClock = () => (Date.now() - P.startedAt) / 1000;
function partyPick() {
  P.pick ||= { game: "race" };
  P.pick.track ||= P.D?.track;
  P.pick.level ||= P.D?.robot[3]?.id || P.D?.robot[0]?.id;
  return P.pick;
}
function partyReport(data) {  // live progress, at most 4 times a second
  if (!P || Date.now() - (P.sentAt || 0) < 250) return;
  P.sentAt = Date.now();
  partySend("progress", data);
}
function partyDone(result) { partySend("done", { result }); }

async function partyMessage(m) {
  if (m.type === "pick" && m.from === hostKey()) { P.pick = m; partyDraw(); }
  if (m.type === "progress") { P.progress[m.from] = m; partyBoard(); }
  if (m.type === "done") { P.done[m.from] = m.result; partyBoard(); partyCheckEnd(); }
  if (m.type === "lobby" && m.from === hostKey()) { stopGame(); clearInterval(P.clock); P.phase = "lobby"; partyDraw(); }
  if (m.type === "start" && m.from === hostKey()) await partyStart(m);
}

async function partyStart(s) {
  stopGame();
  Object.assign(P, { phase: "playing", game: s.game, round: s.round, progress: {}, done: {}, results: null, players: Object.keys(P.members) });
  partyDraw();
  let D;
  try { D = await api(`/api/games?track=${encodeURIComponent(s.track)}`); } catch {
    $("#party-main").innerHTML = `<div class="card empty">Add the course from the Marketplace to play this one.</div>`;
    return partyDone({ missing: true });
  }
  if (s.game === "race") {
    G = { D, game: "racer", party: true, text: s.text, pos: 0, typed: 0, errors: 0, phase: "ready",
          lanes: Object.entries(P.members).map(([k, m]) => [k === P.me ? "you" : k, k === P.me ? "You" : m.name, null]) };
    $("#party-main").innerHTML = raceHtml();
    await raceStart();
  } else if (s.game === "blitz") {
    G = { D: { ...D, invaders: s.lines }, game: "invaders", party: true, keys: new Set(), running: false };
    $("#party-main").innerHTML = `
      <div class="inv-hud"><span class="hud-score">${ic("trophy")} <b id="inv-score">0</b></span><span id="inv-combo" class="hud-combo"></span>
        <span class="spacer"></span><span class="hud-time">${ic("timer")} <b id="inv-time">${s.limit}s</b></span>
        <span id="inv-lives" class="hud-lives">${ic("heart", "life").repeat(3)}</span></div>
      <div class="inv-stage" id="inv-stage"><canvas id="inv-canvas"></canvas><div class="inv-overlay" id="inv-overlay"></div></div>`;
    for (const n of [3, 2, 1]) { $("#inv-overlay").innerHTML = `<div class="countdown">${n}</div>`; tone(440, 0, 0.15, 0.12); await sleep(700); }
    tone(880, 0, 0.3, 0.15);
    invStart(s.seed, s.limit);
  } else {
    $("#party-main").innerHTML = robotLevel(D, s.level, true);
  }
  P.startedAt = Date.now();
  P.clock = setInterval(() => {  // out of time: whatever you got counts
    if (!P || P.done[P.me] || partyClock() < PARTY_GAMES[P.game].limit) return;
    if (G?.game === "racer") { G.phase = "done"; clearInterval(G.tick); }
    partyDone(P.game === "race" ? { finished: false, v: G?.pos / G?.text.length || 0 } : { finished: false });
  }, 1000);
}

function partyStandings() {
  const rows = (P.players || []).filter(k => P.members[k] || P.done[k]).map(k => ({ k, name: P.members[k]?.name || k.split("-")[0], r: P.done[k] }));
  const score = x => !x.r ? -Infinity : P.game === "blitz" ? x.r.score || 0 : x.r.finished ? 1e6 - x.r.time : (x.r.v || 0) - 1;
  return rows.sort((a, b) => score(b) - score(a));
}

function partyCheckEnd() {
  if (P?.phase !== "playing" || !P.players) return;
  const still = P.players.filter(k => P.members[k]);
  if (!still.length || !still.every(k => P.done[k])) return;
  P.phase = "results";
  clearInterval(P.clock);
  partyResults();
}

async function partyResults() {
  const rows = partyStandings(), place = rows.findIndex(x => x.k === P.me) + 1;
  const stat = x => !x.r || x.r.missing ? "-" : P.game === "blitz" ? x.r.score.toLocaleString()
    : x.r.finished ? `${x.r.time.toFixed(1)}s${x.r.wpm ? ` · ${x.r.wpm} WPM` : ""}` : "Didn't finish";
  let xp = 0;
  try { xp = (await api("/api/game/match", { track: P.pick?.track || G?.D?.track, game: P.game, place, players: rows.length })).xp; } catch {}
  place === 1 ? (chime(), confetti()) : chime(true);
  stopGame();
  $("#party-main").innerHTML = `<div class="card party-results">
    <div class="kicker">${ic(PARTY_GAMES[P.game].icon)} ${PARTY_GAMES[P.game].name.toUpperCase()} · RESULTS</div>
    <div class="podium">${rows.map((x, i) => `<div class="pod-row ${x.k === P.me ? "you" : ""} p${i + 1}">
      <span class="place">${i < 3 ? ic(i ? "medal" : "trophy") : ""}${i + 1}</span>${avatar(x.name, null)}
      <b>${esc(x.name)}${x.k === P.me ? " (you)" : ""}</b><span class="spacer"></span><span class="pod-stat">${stat(x)}</span></div>`).join("")}</div>
    <div class="gain">+${xp} XP</div>
    ${isHost() ? `<button class="btn primary" data-act="party-lobby">${ic("rotate-ccw")} Back to the lobby</button>` : `<div class="sub">Waiting for the host to pick the next game…</div>`}
  </div>`;
}

async function partyPage() {
  const code = (route.code || "").toUpperCase();
  if (!/^[A-Z2-9]{6}$/.test(code)) return `<div class="card empty">That game code doesn't look right. Codes are 6 letters and numbers.</div>`;
  if (P?.code !== code) {
    try { await partyJoin(code); } catch (e) {
      partyLeave();
      return `<div class="crumbs"><a href="#/games">Games</a> › Party</div><div class="card empty">${esc(e.message)}</div>`;
    }
  }
  const track = store.get("gameCourse");
  if (!P.D) try {
    P.D = await api(`/api/games?track=${encodeURIComponent(track || (await getOverview()).courses[0]?.track)}`);
    if (isHost()) partySend("pick", partyPick());
  } catch {}
  setTimeout(partyDraw);
  return `
    <div class="crumbs"><a href="#/games">Games</a> › Party</div>
    <div class="party-head">
      <div><div class="eyebrow">${ic("users")} Play with friends</div><h1 class="page-title">Game code <span class="party-code">${code}</span></h1></div>
      <button class="btn" data-act="party-copy">${ic("copy")} Copy code</button>
    </div>
    <div class="party-layout"><div id="party-main"></div><aside class="card party-side" id="party-side"></aside></div>`;
}

function partyDraw() {
  if (!P || !$("#party-side")) return;
  partyBoard();
  if (P.phase !== "lobby") return;
  const host = isHost(), pick = host ? partyPick() : P.pick, n = Object.keys(P.members).length;
  const card = g => `<button class="pg-card ${pick?.game === g ? "on" : ""}" ${host ? `data-act="party-pick" data-value="${g}"` : "disabled"}>
      <span class="gc-icon">${ic(PARTY_GAMES[g].icon)}</span><b>${PARTY_GAMES[g].name}</b><span>${PARTY_GAMES[g].blurb}</span></button>`;
  const levels = P.D?.robot || [];
  $("#party-main").innerHTML = `
    <div class="section-title">${host ? "Pick a game" : `${esc(P.members[hostKey()]?.name || "The host")} is picking a game`}</div>
    <div class="pg-grid">${Object.keys(PARTY_GAMES).map(card).join("")}</div>
    ${pick?.game === "robot" && host && levels.length ? `<label class="pg-level">Level <select data-party-level>${levels.map((l, i) =>
      `<option value="${esc(l.id)}" ${l.id === pick.level ? "selected" : ""}>${i + 1}. ${esc(l.title)}</option>`).join("")}</select></label>` : ""}
    <div class="pg-start">${host
      ? `<button class="btn primary big" data-act="party-start" ${n < 2 ? "disabled" : ""}>${ic("play")} Start ${PARTY_GAMES[pick.game].name}</button>
         <span class="sub">${n < 2 ? "Waiting for a friend to join. Send them the code!" : `${n} players ready`}</span>`
      : `<span class="sub">${ic("clock")} Waiting for the host to start…</span>`}</div>`;
}

function partyBoard() {
  const side = $("#party-side");
  if (!P || !side) return;
  const playing = P.phase === "playing", host = hostKey();
  const status = k => {
    const d = P.done[k], p = P.progress[k];
    if (!playing) return k === host ? `${ic("crown")} Host` : "";
    if (d) return d.missing ? "No course" : P.game === "blitz" ? `${ic("flag")} ${d.score.toLocaleString()}` : d.finished ? `${ic("flag")} ${d.time.toFixed(1)}s` : "Out of time";
    if (P.game === "race") return `<span class="mini-bar"><span style="width:${Math.round((p?.v || 0) * 100)}%"></span></span>`;
    if (P.game === "blitz") return `${(p?.score || 0).toLocaleString()} ${ic("heart", "life")}${p?.lives ?? 3}`;
    return p?.crashes ? `${ic("octagon-x")} ${p.crashes} crash${p.crashes === 1 ? "" : "es"}` : "Coding…";
  };
  side.innerHTML = `<div class="section-title" style="margin-top:0">Players <span>${Object.keys(P.members).length}</span></div>
    ${Object.entries(P.members).sort((a, b) => a[1].joined - b[1].joined).map(([k, m]) => `
      <div class="pl-row ${k === P.me ? "you" : ""}">${avatar(m.name, null)}<b>${esc(m.name)}${k === P.me ? " (you)" : ""}</b>
        <span class="spacer"></span><span class="pl-stat">${status(k)}</span></div>`).join("")}`;
}

// keyboard for the games: Invaders steers and shoots, Racer types. Returns true when the game used the key.
function gameKey(e, down) {
  if (e.target.matches?.("input, textarea")) return false;
  if (G.game === "racer") return down && raceKey(e);
  if (G.game !== "invaders") return false;
  const key = e.key.toLowerCase();
  if (![" ", "arrowleft", "arrowright", "a", "d"].includes(key)) return false;
  e.preventDefault();
  if (down && key === " " && !G.running && !$("#inv-overlay").hidden && !G.score) { invStart(); return true; }
  down ? G.keys.add(key) : G.keys.delete(key);
  return true;
}
document.addEventListener("mousemove", e => {
  if (G?.game !== "invaders" || !G.running) return;
  const box = $("#inv-canvas").getBoundingClientRect();
  if (e.clientY >= box.top && e.clientY <= box.bottom) G.ship.x = Math.max(22, Math.min(G.W - 22, e.clientX - box.left));
});
document.addEventListener("mousedown", e => { if (G?.game === "invaders" && e.target.id === "inv-canvas") G.mouseDown = true; });
document.addEventListener("mouseup", () => { if (G) G.mouseDown = false; });

/* ---------- profiles (yours and your friends', same layout) ---------- */
const TIERS = [[100, "master", "Mastered"], [66, "gold", "Gold"], [33, "silver", "Silver"], [0, "bronze", "Bronze"]];

// one badge per coding language: its logo inside a progress ring that levels up Bronze → Silver → Gold → Mastered
function langBadge(c) {
  const done = doneCount(c.missions), p = pct(done, c.missions.length);
  const [, tier, label] = TIERS.find(([min]) => p >= min);
  return `<div class="lang-badge ${tier}" title="${esc(c.name)}: ${done} of ${c.missions.length} missions">
    <div class="lb-ring" style="--p:${p}"><div class="lb-inner">${logo(c, 44)}</div></div>
    <div class="lb-name">${esc(c.name)}</div>
    <div class="lb-tier">${label} · ${p}%</div>
    <div class="lb-rank">${esc(c.rank)}</div>
  </div>`;
}

const memberSince = iso => iso ? `Member since ${new Date(iso).toLocaleDateString(undefined, { month: "long", year: "numeric" })}` : "";

function missionsList(ov) {
  const row = (c, m) => `<div class="fm ${m.status}">
      <span class="dot">${m.status === "done" ? ic("check") : m.n}</span><span class="fm-t">${esc(m.title)}</span><span class="kind k-${m.kind}">${m.kind}</span>
      ${m.code ? `<button class="btn small" data-act="code" data-track="${esc(c.track)}" data-mission="${esc(m.id)}" data-title="${esc(m.title)}">${ic("code")} View code</button>`
        : m.status === "done" && m.mine ? `<span class="locked-code">${ic("lock")} Not sharing their code</span>`
        : m.status === "done" ? `<span class="locked-code" title="Their code unlocks once you finish this mission too">${ic("lock")} Finish it to see their code</span>` : ""}
    </div>`;
  return ov.courses.map(c => `
    <div class="section-title"><span>${esc(c.name)} missions: ${doneCount(c.missions)} of ${c.missions.length}</span></div>
    <div class="card">${chapters(c.missions).map(ch => `
      <div class="ch-label">${esc(ch.name)} <span>${doneCount(ch.missions)}/${ch.missions.length}</span></div>
      ${ch.missions.map(m => row(c, m)).join("")}`).join("")}</div>`).join("");
}

function profileView(person, ov, isMe) {
  const learning = ov.courses.filter(c => c.missions.some(m => m.status !== "new"));
  const earned = achievements(ov).filter(a => a.got);
  const streak = streaks(activeDays(ov)).current;
  const name = esc(person.username);
  const actions = isMe
    ? `<label class="btn small">${ic("image-plus")} ${person.avatar ? "Change picture" : "Add a picture"}
         <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-pic hidden></label>
       ${person.avatar ? `<button class="btn small" data-act="pic-remove">${ic("trash-2")} Remove picture</button>` : ""}
       <a class="btn small" href="#/settings">${ic("settings")} Settings</a>`
    : `<button class="btn small" data-act="remove" data-name="${name}" data-confirm="1">${ic("user-minus")} Remove friend</button>`;
  const facts = [person.joined ? `${ic("calendar")} ${memberSince(person.joined)}` : "", streak ? `${ic("flame", "flame")} ${streak}-day streak` : "", `${ic("trophy")} ${earned.length} achievement${earned.length === 1 ? "" : "s"}`];
  return `
    ${isMe ? "" : `<div class="crumbs"><a href="#/friends">Friends</a> › ${name}</div>`}
    <div class="card profile-head">
      ${avatar(person.username, person.avatar, "jumbo")}
      <div class="ph-text">
        <h1>${name}</h1>
        <div class="sub">${facts.filter(Boolean).join("  ·  ")}</div>
        ${levelBar(totalXp(ov))}
        <div class="ph-actions">${actions}</div>
      </div>
    </div>
    <div class="section-title">Languages</div>
    ${learning.length ? `<div class="lang-badges">${learning.map(langBadge).join("")}</div>`
      : `<div class="card empty">${isMe ? `No languages yet. <a href="#/market" style="color:var(--accent-hi)">Find one in the Marketplace →</a>` : "No languages started yet."}</div>`}
    <div class="section-title">Stats</div>
    ${statTiles(ov)}
    <div class="section-title">Activity</div>
    ${heatmap(ov)}
    <div class="section-title">Achievements</div>
    ${earned.length ? `<div class="badges">${earned.map(badge).join("")}</div>` : `<div class="card empty">No achievements yet.</div>`}
    ${isMe ? "" : missionsList(ov)}`;
}

}

async function userPage() {

async function showCode(track, mission, title) {
  const r = await api(`/api/user/code?name=${encodeURIComponent(route.name)}&track=${encodeURIComponent(track)}&mission=${encodeURIComponent(mission)}`);
