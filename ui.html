async function doAct(el) {
  const { act, name } = el.dataset;
  try {
    if (act === "auth-switch") {
      authMode = authMode === "signin" ? "signup" : "signin";
      $("#auth").innerHTML = authScreen();
      return;
    }
    if (act === "signout") {
      await api("/api/signout", {});
      authMode = "signin";
      return render();
    }
    if (act === "market-add") {
      el.disabled = true;
      el.innerHTML = `<span class="spin"></span> Downloading…`;
      await api("/api/market/add", { id: el.dataset.id });
      toast("Course ready! Find it in My courses.");
      return render(true);
    }
    if (act === "market-remove") {
      if (!confirm(`Remove ${el.dataset.name} from your courses? Your code and progress stay, so you can add it back anytime.`)) return;
      await api("/api/market/remove", { id: el.dataset.id });
      toast("Course removed");
      return render(true);
    }
    if (act === "game-course") return go(`#/games/${el.dataset.value}`);
    if (act === "robot-run") return robotRun();
    if (act === "robot-reset") return void ($("#g-code").value = G.L.starter);
    if (act === "robot-world") return busy || drawWorld(+el.dataset.value);
    if (act === "robot-speed") {
      G.speed = +el.dataset.value;
      store.set("robotSpeed", G.speed);
      return el.parentElement.querySelectorAll("button").forEach(b => b.classList.toggle("on", b === el));
    }
    if (act === "robot-insert") {
      const box = $("#g-code");
      box.setRangeText(el.dataset.value + "\n", box.selectionStart, box.selectionEnd, "end");
      return box.focus();
    }
    if (act === "inv-start") return invStart();
    if (act === "race-start") return raceStart();
    if (act === "game-again") return render();
    if (act === "party-create") return go(`#/party/${newPartyCode()}`);
    if (act === "party-copy") { await navigator.clipboard.writeText(P.code); return toast(`Copied ${P.code}. Send it to your friends!`); }
    if (act === "party-pick") { partyPick().game = el.dataset.value; partySend("pick", P.pick); return partyDraw(); }
    if (act === "party-lobby") return partySend("lobby");
    if (act === "party-start") {
      const pick = partyPick(), s = { game: pick.game, track: pick.track, round: P.round + 1 };
      if (pick.game === "race") s.text = shuffle(P.D.racer).slice(0, 2).join("\n");
      if (pick.game === "blitz") Object.assign(s, { seed: Math.floor(Math.random() * 2 ** 31), lines: P.D.invaders, limit: 90 });
      if (pick.game === "robot") s.level = pick.level;
      return partySend("start", s);
    }
    if (act === "copy-name") {
      await navigator.clipboard.writeText(ME.username);
      return toast(`Copied "${ME.username}". Send it to a friend!`);
    }
    if (act === "board-range") {
      boardRange = el.dataset.value;
      return render(true);
    }
    if (act === "sync") {
      el.disabled = true;
      ME = await api("/api/sync", {});
      toast("Synced");
      return render(true);
    }
    if (act === "check-update") {
      el.disabled = true;
      ME = await api("/api/update/check", {});
      toast(ME.update.available ? "An update is available!" : "You're on the latest version");
      return render(true);
    }
    if (act === "update") {
      el.disabled = true;
      el.innerHTML = `<span class="spin"></span> Updating…`;
      await api("/api/update", {});
      toast("Downloaded! Restarting with the new version…");
      return waitForNewVersion(ME.version);
    }
    if (act === "pic-remove") {
      ME = await api("/api/avatar", { avatar: null });
      toast("Picture removed");
      return render(true);
    }
    if (act === "code") return await showCode(el.dataset.track, el.dataset.mission, el.dataset.title);
    if (act === "remove" && el.dataset.confirm && !confirm(`Remove ${name} from your friends?`)) return;
    await api(`/api/friends/${act}`, { username: name });
    toast(act === "accept" ? `You and ${name} are now friends!` : "Done");
    el.dataset.confirm ? go("#/friends") : render(true);
  } catch (err) {
    toast(err.message);
  }
}

document.addEventListener("submit", async e => {
  const form = e.target.closest("[data-form]");
  if (!form) return;
  e.preventDefault();
  const data = Object.fromEntries(new FormData(form));
  const btn = form.querySelector("button");
  btn.disabled = true;
  try {
    if (form.dataset.form === "password") {
      await api("/api/password", data);
      toast("Password changed");
      form.reset();
      btn.disabled = false;
      return;
    }
    if (form.dataset.form === "party-join") return go(`#/party/${data.code.trim().toUpperCase()}`);
    if (form.dataset.form === "add") {
      const r = await api("/api/friends/add", data);
      toast(r.result === "accepted" ? `You and ${data.username} are now friends!` : `Request sent to ${data.username}`);
      return render(true);
    }
    await api(`/api/${form.dataset.form}`, data);
    toast(form.dataset.form === "signup" ? "Account created. Welcome!" : "Welcome back!");
    authMode = "signin";
    go("#/dashboard");
  } catch (err) {
    toast(err.message);
    btn.disabled = false;
  }
});

/* ---------- settings ---------- */
const ACCENTS = { red: "#ef233c", orange: "#f97316", gold: "#eab308", green: "#22c55e", blue: "#3b82f6", purple: "#a855f7", pink: "#ec4899" };

function applySettings(s) {
  const root = document.documentElement;
  root.dataset.accent = s.accent;
  root.dataset.background = s.background;
  root.classList.toggle("reduce-motion", s.reduce_motion);
  soundOn = s.sound;
}

async function saveSetting(key, value) {
  try {
    ME = await api("/api/settings", { [key]: value });
    applySettings(ME.settings);
    if (route.page === "settings") render(true);
  } catch (err) {
    toast(err.message);
  }
}

function settingsPage() {
  const s = ME.settings, up = ME.update || {}, sync = ME.sync || {};
  const toggle = (key, label, desc) => `<label class="setting"><span><b>${label}</b><small>${desc}</small></span>
    <input type="checkbox" class="switch" data-setting="${key}" ${s[key] ? "checked" : ""}></label>`;
  const row = (label, desc, control) => `<div class="setting"><span><b>${label}</b><small>${desc}</small></span>${control}</div>`;
  const synced = sync.error ? `Last sync failed: ${esc(sync.error)}`
    : sync.synced_at ? `Last synced at ${new Date(sync.synced_at * 1000).toLocaleTimeString()}` : "Your progress syncs after every check";
  return `
    <div class="eyebrow">Settings</div>
    <h1 class="page-title">Settings</h1>
    <p class="lede">Saved on this computer and kept across updates.</p>

    <div class="section-title">Appearance</div>
    <div class="card settings">
      ${row("Accent color", "Buttons, highlights and progress bars", `<div class="swatches">${Object.entries(ACCENTS).map(([name, hex]) =>
        `<button class="swatch ${s.accent === name ? "on" : ""}" style="background:${hex}" data-set="accent" data-value="${name}" title="${name}"></button>`).join("")}</div>`)}
      ${row("Background", "Pitch black looks great on OLED screens", `<div class="seg">${[["dark", "Dark"], ["black", "Pitch black"]].map(([v, l]) =>
        `<button class="${s.background === v ? "on" : ""}" data-set="background" data-value="${v}">${l}</button>`).join("")}</div>`)}
    </div>

    <div class="section-title">Effects</div>
    <div class="card settings">
      ${toggle("sound", "Sound effects", "Chimes when tests pass and missions are completed")}
      ${toggle("confetti", "Confetti", "Celebrate finished missions")}
      ${toggle("reduce_motion", "Reduce motion", "Turn off animations and confetti")}
    </div>

    <div class="section-title">Missions</div>
    <div class="card settings">
      ${toggle("open_vscode", "Open VS Code when starting a mission", "When off, the file is created and you open it yourself")}
    </div>

    <div class="section-title">Privacy</div>
    <div class="card settings">
      ${toggle("share_code", "Share my code with friends", "Friends can read your solution for a mission once they've finished it too. Turning this off also removes the code you've already shared.")}
    </div>

    <div class="section-title">Account</div>
    <div class="card settings">
      <form class="setting" data-form="password"><span><b>Change password</b><small>At least 8 characters</small></span>
        <span class="inline"><input name="password" type="password" minlength="8" required autocomplete="new-password" placeholder="New password">
        <button class="btn">Change</button></span></form>
      ${row("Sync", synced, `<button class="btn" data-act="sync">${ic("refresh-cw")} Sync now</button>`)}
      ${row(`Signed in as ${esc(ME.username)}`, esc(ME.email), `<button class="btn" data-act="signout">${ic("log-out")} Sign out</button>`)}
    </div>

    <div class="section-title">About</div>
    <div class="card settings">
      ${row(`learn/programming · version ${esc(ME.version)}`, up.available ? "An update is ready to install" : "Updates install automatically when you open the app",
        up.available ? `<button class="btn primary" data-act="update">${ic("download")} Update now</button>` : `<button class="btn" data-act="check-update">${ic("refresh-cw")} Check for updates</button>`)}
    </div>`;
}

document.addEventListener("change", e => {
  if (e.target.matches("[data-setting]")) saveSetting(e.target.dataset.setting, e.target.checked);
});

/* ---------- course: sidebar ---------- */
function renderSide(xpShown = S.xp) {
  $("#course-title").innerHTML = `${logo(S, 20)}${esc(S.name)}`;
  $("#rank").textContent = S.rank;
  $("#xp").textContent = xpShown;
  if (S.next) {
    $("#next").textContent = `${S.next[0] - S.xp} XP to ${S.next[1]}`;
    $("#bar").style.width = pct(S.xp - S.rank_xp, S.next[0] - S.rank_xp) + "%";
  } else {
    $("#next").textContent = "max rank!";
    $("#bar").style.width = "100%";
  }
  const cur = S.missions[current - 1];
  $("#list").innerHTML = chapters(S.missions).map(ch => {
    const done = doneCount(ch.missions);
    const isClosed = closed.has(ch.name) && ch.name !== cur.chapter;
    return `<section class="chapter ${isClosed ? "closed" : ""}">
      <button class="ch-head" data-chapter="${esc(ch.name)}"><span class="caret">▼</span>
        <span class="ch-name">${esc(ch.name)}</span><span class="ch-count">${done}/${ch.missions.length}</span></button>
      <div class="ch-bar"><div style="width:${pct(done, ch.missions.length)}%"></div></div>
      <div class="items">${ch.missions.map(m => `
        <button class="item ${m.status} ${m.n === current ? "active" : ""}" data-n="${m.n}">
          <span class="dot">${m.status === "done" ? ic("check") : m.n}</span>
          <span class="t"><div class="name">${esc(m.title)}</div>
          <div class="meta"><span class="kind k-${m.kind}">${m.kind}</span><span>${m.xp} xp</span></div></span>
        </button>`).join("")}</div>
    </section>`;
  }).join("");
}

/* ---------- course: mission view ---------- */
function renderBrief(md) {
  md = md.replace(/^# .*\n(\*\*.*\n)?/, "");  // the header card already shows the title line
  return window.marked ? marked.parse(md) : `<pre>${esc(md)}</pre>`;
}

function renderMission() {
  const m = S.missions[current - 1];
  const inChapter = S.missions.filter(x => x.chapter === m.chapter).length;
  const started = m.status !== "new";
  $("#view").innerHTML = `
    <div class="crumbs"><a href="#/courses">Courses</a> › <a href="#/${S.track}">${logo(S, 14)} ${esc(S.name)}</a> › ${esc(m.chapter)}</div>
    <div class="head">
      <div class="num">${esc(m.chapter)} · Mission ${m.chapter_n} / ${inChapter}${m.status === "done" ? ` <span class="done-tag">· ${ic("check")} complete</span>` : ""}</div>
      <h1>${esc(m.title)}</h1>
      <div class="row"><span class="kind k-${m.kind}">${m.kind}</span><span class="xp-pill">${m.xp} XP</span>
        <span>your file <code>${esc(m.file)}</code></span></div>
    </div>
    <div class="actions">
      ${started
        ? `<button class="btn check" id="check">${ic("play")} Check my code <kbd>Ctrl+Enter</kbd></button>
           <button class="btn" id="open">${ic("code")} Open in VS Code</button>
           <span class="hint-text">Save first (Ctrl+S)</span>`
        : `<button class="btn primary" id="start">${ic("rocket")} Start mission</button>
           <span class="hint-text">Creates your file and opens it in VS Code</span>`}
      <span class="spacer"></span>
      <button class="icon-btn" id="sound" title="Sound on/off">${ic(soundOn ? "volume-2" : "volume-x")}</button>
    </div>
    <div id="results"></div>
    <article class="brief">${renderBrief(m.brief)}</article>`;
  document.querySelectorAll(".brief a").forEach(a => a.target = "_blank");
  document.querySelectorAll(".brief summary").forEach(sm => sm.insertAdjacentHTML("afterbegin", ic("lightbulb") + " "));
  if (lastCheck && lastCheck.n === current) renderResults(lastCheck.data, false);
}

const select = n => go(`#/${S.track}/${n}`);

/* ---------- results ---------- */
function failBody(t) {
  const text = t.message + (t.detail ? "\n" + t.detail : "");
  const got = text.match(/^\s*got:\s+(.*)$/m), want = text.match(/^\s*expected:\s+(.*)$/m);
  if (got && want) {
    const quoted = s => /^['"]/.test(s);
    const note = quoted(got[1]) && !quoted(want[1])
      ? `<p class="note">${ic("message-circle")} Your answer has quotes around it, so it's <b>text</b> (a string). The answer should be a plain value. Is there an f-string or <code>str()</code> where you meant to return the value itself?</p>`
      : "";
    return `<div>${esc(t.message)}</div>
      <div class="ge"><div>your code gave</div><div class="got">${esc(got[1])}</div>
      <div>it should be</div><div class="want">${esc(want[1])}</div></div>${note}`;
  }
  return `<div>${esc(t.message)}</div>${t.detail ? `<pre class="detail">${esc(t.detail)}</pre>` : ""}`;
}

// where test results come from: a mission (a file you can open in VS Code) or a game (code typed in the app)
const missionCtx = () => ({ errors: S.errors, file: S.missions[current - 1].file.split("/").pop(), editor: true });

function crashBody(t, ctx) {
  const e = t.error || {};
  const explain = ctx.errors[e.type];
  return `<div class="err">
      <div><span class="etype">${esc(e.type || "Error")}</span> <span class="emsg">${esc(e.message)}</span></div>
      ${explain ? `<p class="explain">${esc(explain)}</p>` : ""}
      ${e.line ? `<div class="where">It happened in <b>${esc(ctx.file)}</b>, line ${e.line}:</div>
        <pre class="line">${esc(e.code)}</pre>
        ${ctx.editor ? `<button class="linkbtn" data-line="${e.line}">Jump to line ${e.line} in VS Code →</button>` : ""}` : ""}
    </div>
    <details class="raw" style="padding:6px 0 0;border:0"><summary>Full error (traceback)</summary><pre>${esc(t.detail)}</pre></details>`;
}

function renderResults(r, animate = true, ctx = missionCtx()) {
  const tests = r.results, passing = tests.filter(t => t.status === "PASS").length;
    const label = { PASS: "", FAIL: "wrong answer", CRASH: "crashed", TODO: "not written yet" };
  const headline = r.passed ? "All tests passing!" : tests.length ? `${passing} of ${tests.length} tests passing` : "No test output";
  $("#results").innerHTML = `
    <section class="results ${r.passed ? "pass" : "fail"}">
      <div class="r-head"><span class="big">${r.passed ? ic("party-popper", "pass-ic") + " " : ""}${headline}</span>
        <div class="pips">${tests.map(t => `<span class="pip ${animate ? "" : t.status}"></span>`).join("")}</div></div>
      ${tests.map((t, i) => `
        <div class="test ${t.status}" style="animation-delay:${animate ? i * 120 : 0}ms">
          <span class="ic">${ic({ PASS: "circle-check", FAIL: "circle-x", CRASH: "triangle-alert", TODO: "circle-dashed" }[t.status])}</span>
          <span class="tn">${esc(human(t.name))}<small>${label[t.status]}</small></span>
          ${t.status === "FAIL" ? `<div class="body">${failBody(t)}</div>` : ""}
          ${t.status === "CRASH" ? `<div class="body">${crashBody(t, ctx)}</div>` : ""}
        </div>`).join("")}
      ${!r.passed ? `<div class="r-head tip"><span>Tip: fix the <b>first</b> problem, save, and check again. One thing at a time.</span></div>` : ""}
      <details class="raw"><summary>Raw test output</summary><pre>${esc(r.output)}</pre></details>
    </section>`;
  if (animate) {
    tests.forEach((t, i) => setTimeout(() => {
      document.querySelectorAll(".pip")[i]?.classList.add(t.status);
      if (t.status === "PASS") blip(660 + Math.min(i, 12) * 60, 0.05);
    }, i * 120));
  }
}

/* ---------- actions ---------- */
async function start() {
  const r = await api("/api/start", { track: S.track, mission: current });
  S = r.state;
  renderSide(); renderMission();
  toast(r.opened ? "Opened in VS Code. Read the brief, then start coding!"
    : ME.settings.open_vscode ? "File created. (VS Code's `code` command wasn't found, so open it yourself.)"
    : "File created. Click Open in VS Code when you're ready.");
}

async function openEditor(line) {
  const r = await api("/api/open", { track: S.track, mission: current, line });
  toast(r.opened ? (line ? `Jumped to line ${line}` : "Opened in VS Code") : "Couldn't find VS Code's `code` command.");
}

async function check() {
  const btn = $("#check");
  if (!btn || busy) return;
  busy = true;
  btn.disabled = true; btn.innerHTML = `<span class="spin"></span> Running tests…`;
  try {
    const ovBefore = await getOverview();
    const hadBadges = new Set(achievements(ovBefore).filter(a => a.got).map(a => a.title));
    const r = await api("/api/check", { track: S.track, mission: current });
    const before = r.before;
    S = r.state;
    lastCheck = { n: current, data: r };
    renderSide(before.xp);
    renderMission();
    renderResults(r);
    const delay = r.results.length * 120 + 250;
    if (r.first_time) {
      const fresh = achievements(await getOverview()).filter(a => a.got && !hadBadges.has(a.title));
      const total = totalXp(ovBefore);
      setTimeout(() => celebrate(before, fresh, [levelOf(total).level, levelOf(total + S.xp - before.xp).level]), delay);
    }
    else if (r.passed) setTimeout(() => { chime(true); toast("Still passing"); }, delay);
    else setTimeout(() => $("#check")?.classList.add("shake"), delay);
  } catch (e) {
    toast("Error: " + e.message);
    renderMission();
  } finally {
    busy = false;
  }
}

function celebrate(before, badges, [oldLevel, newLevel]) {
  const m = S.missions[current - 1];
  chime();
  confetti();
  $("#win-title").textContent = m.title;
  $("#win-level").hidden = oldLevel === newLevel;
  $("#win-level").innerHTML = `${ic("chevrons-up")} Level up! You're level ${newLevel}`;
  $("#win-rank").hidden = before.rank === S.rank;
  $("#win-rank").innerHTML = `${ic("trending-up")} Rank up: ${esc(S.rank)}`;
  $("#win-ach").innerHTML = badges.map(a => `<div>${a.icon} Achievement unlocked: ${esc(a.title)}</div>`).join("");
  const next = S.missions.find(x => x.n > current && x.status !== "done") || nextMission(S.missions);
  $("#win-next").textContent = next ? `Next: ${next.title} →` : "You finished the course!";
  $("#win-next").onclick = () => { $("#win").classList.add("hidden"); go(next ? `#/${S.track}/${next.n}` : "#/achievements"); };
  $("#win").classList.remove("hidden");
  countUp($("#win-xp"), 0, m.xp, 900);
  countUp($("#xp"), before.xp, S.xp, 1400);
  $("#player").classList.remove("bump"); void $("#player").offsetWidth; $("#player").classList.add("bump");
}

function countUp(el, from, to, ms) {
  const t0 = performance.now();
  const step = now => {
    const p = Math.min(1, (now - t0) / ms);
    el.textContent = Math.round(from + (to - from) * (1 - Math.pow(1 - p, 3)));
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function toast(msg) {
  const t = $("#toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => t.classList.remove("show"), 2800);
}

/* ---------- sound ---------- */
let audio;
function tone(freq, at, len, vol = 0.18, type = "triangle") {
  if (!soundOn) return;
  audio = audio || new AudioContext();
  const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime + at;
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + len);
  o.connect(g).connect(audio.destination);
  o.start(t); o.stop(t + len + 0.05);
}
const blip = (f, vol) => tone(f, 0, 0.12, vol, "sine");
function chime(small) {
  const notes = small ? [784, 1047] : [523, 659, 784, 1047, 1319];
  notes.forEach((f, i) => tone(f, i * 0.09, small ? 0.3 : 0.6));
}

/* ---------- confetti ---------- */
function confetti() {
  if (!ME.settings.confetti || ME.settings.reduce_motion) return;
  const c = $("#fx"), ctx = c.getContext("2d");
  c.width = innerWidth; c.height = innerHeight;
  const css = getComputedStyle(document.documentElement);  // confetti in your accent color, plus gold and white
  const colors = ["--accent", "--accent-hi", "--accent-deep", "--gold", "--gold-hi"].map(v => css.getPropertyValue(v).trim()).concat("#ffffff");
  const bits = Array.from({ length: 200 }, (_, i) => {
    const left = i % 2 === 0;
    return { x: left ? 0 : c.width, y: c.height * 0.75, vx: (left ? 1 : -1) * (6 + Math.random() * 10), vy: -(10 + Math.random() * 14),
             r: Math.random() * 6, vr: Math.random() * 0.3 - 0.15, w: 6 + Math.random() * 6, h: 8 + Math.random() * 10,
             color: colors[i % colors.length] };
  });
  const t0 = performance.now();
  (function frame(now) {
    ctx.clearRect(0, 0, c.width, c.height);
    for (const b of bits) {
      b.vy += 0.35; b.vx *= 0.985; b.x += b.vx; b.y += b.vy; b.r += b.vr;
      ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.fillStyle = b.color; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h * Math.abs(Math.cos(b.r * 3)));
      ctx.restore();
    }
    if (now - t0 < 4000) requestAnimationFrame(frame); else ctx.clearRect(0, 0, c.width, c.height);
  })(t0);
}

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const act = e.target.closest("[data-act]");
  if (act) return doAct(act);
  const set = e.target.closest("[data-set]");
  if (set) return saveSetting(set.dataset.set, set.dataset.value);
  if (e.target.id === "cm-close" || e.target.id === "code-view") return $("#code-view").classList.add("hidden");
  const head = e.target.closest(".ch-head");
  if (head) {
    const name = head.dataset.chapter;
    closed.has(name) ? closed.delete(name) : closed.add(name);
    store.set("closedChapters", JSON.stringify([...closed]));
    head.parentElement.classList.toggle("closed");
    return;
  }
  const item = e.target.closest(".item");
  if (item) return select(+item.dataset.n);
  const id = e.target.closest("button")?.id;
  if (id === "start") start();
  if (id === "check") check();
  if (id === "open") openEditor();
  if (id === "win-stay") $("#win").classList.add("hidden");
  if (id === "sound") {
    saveSetting("sound", !soundOn);
    e.target.closest("button").innerHTML = ic(!soundOn ? "volume-2" : "volume-x");
  }
  const jump = e.target.closest("[data-line]");
  if (jump) openEditor(+jump.dataset.line);
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && route.page === "course") { e.preventDefault(); check(); }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey) && G?.game === "robot") { e.preventDefault(); robotRun(); }
  if (G && gameKey(e, true)) return;
  if (e.key === "Tab" && e.target.id === "g-code") {  // Tab indents (4 spaces) instead of leaving the box
    e.preventDefault();
    e.target.setRangeText("    ", e.target.selectionStart, e.target.selectionEnd, "end");
  }
  if (e.key === "Enter" && !e.ctrlKey && !e.metaKey && e.target.id === "g-code") {  // keep the indent, plus 4 after a ":"
    e.preventDefault();
    const box = e.target, line = box.value.slice(0, box.selectionStart).split("\n").pop();
    const indent = line.match(/^ */)[0] + (line.trimEnd().endsWith(":") ? "    " : "");
    box.setRangeText("\n" + indent, box.selectionStart, box.selectionEnd, "end");
  }
  if (e.key === "Escape") { $("#win").classList.add("hidden"); $("#code-view").classList.add("hidden"); }
});
document.addEventListener("keyup", e => G && gameKey(e, false));
document.addEventListener("change", e => {
  if (e.target.matches("[data-party-level]") && P) { partyPick().level = e.target.value; partySend("pick", P.pick); }
});
window.addEventListener("blur", () => G?.keys?.clear());  // no stuck keys after switching windows
window.addEventListener("hashchange", () => render());
// coming back from VS Code: refresh in case files changed
window.addEventListener("focus", async () => {
  // Skip pages with forms: re-rendering would wipe half-typed text, and on the profile page it would
  // throw away the file box just as the picture picker closes (so the chosen picture got lost).
  if (busy || !ME.signed_in || ["profile", "friends", "settings", "games", "party"].includes(route.page)) return;
  if (route.page === "course" && S) {
    S = await api(`/api/state?track=${encodeURIComponent(S.track)}`);
    renderSide();
  } else {
    render(true);
  }
});

// whenever anything new is drawn, turn its icon placeholders into real icons (one pass per frame)
let iconsQueued = false;
const drawIcons = () => { iconsQueued = false; window.lucide?.createIcons(); };
new MutationObserver(() => {
  if (!iconsQueued) { iconsQueued = true; requestAnimationFrame(drawIcons); }
}).observe(document.body, { childList: true, subtree: true });
drawIcons();

render();
</script>
