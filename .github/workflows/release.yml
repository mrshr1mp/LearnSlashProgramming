# Builds the installable app on GitHub's computers.
# - Push a tag like v0.2.0  -> builds Windows + Linux installers and publishes them as a release
#   (installed apps see "Update available" and update themselves).
# - Push changes to the app shell -> a test build only (download it from the run's Artifacts).
name: Build the app

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["src-tauri/**", ".github/workflows/release.yml"]

permissions:
  contents: write

jobs:
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.release.outputs.result }}
    steps:
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace("refs/tags/", "");
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner, repo: context.repo.repo, tag_name: tag, draft: true,
              name: `learn/programming ${tag}`,
              body: "Windows: download the `.exe` and run it.\nLinux: download the `.AppImage` (or the `.deb` for Ubuntu/Debian).",
            });
            return data.id;

  build:
    needs: [create-release]
    if: always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.platform }}
    env:
      RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: npm install

      - name: Put the Python app inside the bundle
        shell: bash
        run: mkdir -p src-tauri/app && cp app.py cloud.py cloud.json learn.py updates.py ui.html src-tauri/app/

      - name: Bundle Python (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip -OutFile python.zip
          Expand-Archive python.zip src-tauri/python
          # without this file the bundled Python acts like a normal one (tests can import the helpers next to them)
          Remove-Item src-tauri/python/python312._pth

      - name: Version from the tag
        if: env.RELEASE == 'true'
        shell: bash
        run: node -e "const f='src-tauri/tauri.conf.json',fs=require('fs'),c=JSON.parse(fs.readFileSync(f));c.version=process.env.GITHUB_REF_NAME.slice(1);fs.writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Build and publish (release)
        if: env.RELEASE == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          releaseId: ${{ needs.create-release.outputs.id }}

      - name: Build (test only, no update signing)
        if: env.RELEASE != 'true'
        uses: tauri-apps/tauri-action@v0
        with:
          args: --config {"bundle":{"createUpdaterArtifacts":false}}
      - name: Keep the test build
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb

  publish:
    needs: [create-release, build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner, repo: context.repo.repo,
              release_id: Number("${{ needs.create-release.outputs.id }}"), draft: false,
            });
