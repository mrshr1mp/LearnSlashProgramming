<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>learn/programming</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #0b0b0d; color: #a1a1aa;
         font: 15px system-ui, sans-serif; }
  .box { text-align: center; }
  .logo { width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 14px; background: #ef233c; color: #fff;
          display: grid; place-items: center; font: 700 22px Consolas, monospace; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(.92); opacity: .7; } }
  .err { display: none; color: #ff5470; max-width: 420px; }
  body.failed .err { display: block; } body.failed .wait { display: none; } body.failed .logo { animation: none; }
</style>
</head>
<body>
  <div class="box">
    <div class="logo">&gt;_</div>
    <div class="wait">Starting learn/programming…</div>
    <div class="err">The app didn't start. Close it and open it again.<br>If it keeps happening, send the file
      <b>app.log</b> from your app data folder to whoever set this up.</div>
  </div>
</body>
</html>
